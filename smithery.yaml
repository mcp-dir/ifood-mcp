# Smithery configuration for iFood
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_ifood

name: ifood-mcp
displayName: "iFood"
description: >
  Insights da sua loja no iFood direto no chat do seu assistente de IA. Gere gráficos de vendas e repasses no tempo, ticket médio, taxas, mix de cardápio e satisfação (avaliações), tudo pela API oficial do iFood. A conexão usa o app oficial homologado, você não informa credenciais.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/ifood-mcp
repository: https://github.com/mcp-dir/ifood-mcp

tags:
  - ifood
  - brazil
  - food
  - vertical
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_ifood

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_ifood/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
